<?xml version="1.0" encoding="UTF-8"?>
<!-- Wazzup app icon: two-tone (green + white), flat glyph, fine iOS 6 "Messages" pinstripes and the iconic curved top gloss.
     Not WhatsApp's own mark (different bubble/tail shape). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd06a"/>
      <stop offset="1" stop-color="#14a043"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#000000" fill-opacity="0.045"/>
    </pattern>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="translate(308 266) scale(17)" fill="#000">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#stripes)"/>
  <!-- flat white bubble with handset cut out (two-tone) -->
  <g mask="url(#cut)">
    <circle cx="512" cy="470" r="300" fill="#ffffff"/>
    <path d="M300 640 L215 830 L440 735 z" fill="#ffffff"/>
  </g>
  <!-- iconic iOS 6 top gloss -->
  <path d="M0 0 h1024 v470 c-260 110 -764 110 -1024 0 z" fill="url(#gloss)"/>
  <rect x="2" y="2" width="1020" height="1020" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
</svg>
